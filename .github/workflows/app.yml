name: app

on:
  push:
    paths: ["app/**", "eval/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "eval/**", ".github/workflows/app.yml"]
  workflow_dispatch:

# Free for public repositories: analyse, test against the real CAO
# ground truth, and build an installable Android APK on every push.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name repeatx --org com.neemaygupta --platforms android,ios
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: repeatx-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
